<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LAB2</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        </style>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="login.css">
    </head>
    <body data-requer-login>
        <div class="topo">
            <header>
                <div class="menu">
                    <nav>
                        <div class="logo"><img src="logo-escura.png" alt="CAR Logo"/></div>
                        <ul class="ul">
                            <li><a href="index.html">Início</a></li>
                            <li><a href="veiculos.html" class="ativa">Veículos</a></li>
                            <li><a href="pedidos.html">Pedidos</a></li>
                        </ul>
                        <button type="button" class="btn-tema" id="btn-tema" title="Mudar tema">
                            <img src="Son.png" class="btn-sol" alt="Mudar tema"/>
                        </button>
                        <a href="login.html" class="btn-entrar"><p>Entrar</p></a>
                        <a href="cadastro.html" class="btn-cadastrar"><p>Cadastrar</p></a>
                    </nav>
                </div>
            </header>
        </div>

        <main class="veiculos-container" id="veiculos">
            <div class="veiculos-header">
                <h1 class="section-title">Veículos disponíveis</h1>
                <div class="filtros">
                    <input type="text" id="filtro-busca" placeholder="Buscar marca ou modelo">
                    <select id="filtro-dono">
                        <option value="">Todos os proprietários</option>
                        <option value="agente">Locadoras</option>
                        <option value="banco">Bancos</option>
                        <option value="cliente">Clientes</option>
                    </select>
                </div>
            </div>
            <div class="veiculos-grid" id="grid-veiculos"></div>
        </main>

        <!-- Novo pedido de aluguel -->
        <div class="modal fade" id="modal-pedido" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <form class="modal-content" id="form-pedido" style="width:100%;padding:0;">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modal-titulo">Novo pedido</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <label for="data-inicio">RETIRADA</label>
                        <input type="date" id="data-inicio" required>
                        <label for="data-fim">DEVOLUÇÃO</label>
                        <input type="date" id="data-fim" required>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="solicita-credito" style="width:auto;margin:4px 8px 0 -1.5em;">
                            <label class="form-check-label" for="solicita-credito" style="font-size:14px;font-weight:600;">Solicitar contrato de crédito a um banco</label>
                        </div>
                        <p class="m-0" style="font-size:16px;">Total estimado: <strong id="valor-total">R$ 0,00</strong></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn-submit-cad" style="width:auto;padding:10px 24px;">Enviar pedido</button>
                    </div>
                </form>
            </div>
        </div>

        <footer class="rodape">
            <div class="container-rodape">
                <div class="rodape-inferior">
                    <p><small>&copy; 2026 CARent - Sistema de Locação de Veículos.</small></p>
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="site.js"></script>
        <script src="veiculos.js"></script>
    </body>
</html>
