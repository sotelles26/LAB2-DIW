<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LAB2</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        </style>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <!-- Topo da página -->
        <div class="topo">
            <header>
                <div class="menu">
                    <nav>
                        <div class="logo">
                            <img src="logo-escura.png" alt="CAR Logo"/>
                        </div>
                        <ul class="ul">
                            <li><a href="index.html">Início</a></li>
                            <li><a href="veiculos.html">Veículos</a></li>
                            <li><a href="pedidos.html">Pedidos</a></li>
                        </ul>  
                        <button type="button" class="btn-tema" id="btn-tema">
                            <img src="Son.png" class="btn-sol" alt="Mudar tema"/>
                        </button>  
                        <a href="login.html" class="btn-entrar"><p>Entrar</p></a>
                        <a href="cadastro.html" class="btn-cadastrar"><p>Cadastrar</p></a>
                    </nav>
                </div>
            </header>
        </div>    

        <!-- Conteúdo do Form de Cadastro -->
        <main class="cadastro-container">
            <form id="form-cadastro" class="card-cadastro">
                
                <!-- Tipo de Cadastro -->
                <div class="secao-form">
                    <label class="section-label">TIPO DE CADASTRO</label>
                    <div class="toggle-group">
                        <button type="button" class="btn-toggle active">Cliente</button>
                        <button type="button" class="btn-toggle">Locador</button>
                        <button type="button" class="btn-toggle">Banco</button>
                    </div>
                </div>

                <!-- Imagem de Perfil -->
                <div class="secao-form">
                    <h2>Imagem de Perfil</h2>
                    <div class="box-upload-perfil">
                        <div class="avatar-placeholder">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                        </div>
                        <span class="upload-text">Foto do usuário</span>
                        <label for="upload-foto" class="btn-upload">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            Selecionar
                        </label>
                        <input type="file" id="upload-foto" accept="image/*" style="display: none;">
                    </div>
                </div>

                <!-- Dados Principais -->
                <div class="secao-form">
                    <h2>Dados Principais</h2>
                    
                    <div class="grid-2">
                        <div class="input-group">
                            <label for="nome">NOME / RAZÃO SOCIAL</label>
                            <input type="text" id="nome" placeholder="Ex: João Silva ou Empresa S.A." required>
                        </div>
                        <div class="input-group">
                            <label for="email">E-MAIL</label>
                            <input type="email" id="email" placeholder="email@exemplo.com" required>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="input-group">
                            <label for="password">SENHA</label>
                            <input type="password" id="password" placeholder="********" required>
                        </div>
                        <div class="input-group">
                            <label for="confirm-password">CONFIRMAR SENHA</label>
                            <input type="password" id="confirm-password" placeholder="********" required>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="input-group">
                            <label for="cpf-cnpj">CPF / CNPJ</label>
                            <input type="text" id="cpf-cnpj" placeholder="000.000.000-00">
                        </div>
                        <div class="input-group">
                            <label for="rg">RG</label>
                            <input type="text" id="rg" placeholder="00.000.000-0">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="profissao">PROFISSÃO</label>
                        <input type="text" id="profissao" placeholder="Engenheiro, Médico, etc.">
                    </div>
                </div>

                <!-- Endereço -->
                <div class="secao-form">
                    <h2>Endereço</h2>

                    <div class="input-group">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" placeholder="00000-000">
                    </div>

                    <div class="grid-logradouro">
                        <div class="input-group">
                            <label for="logradouro">LOGRADOURO</label>
                            <input type="text" id="logradouro" placeholder="Rua, Av, etc.">
                        </div>
                        <div class="input-group">
                            <label for="estado">ESTADO</label>
                            <input type="text" id="estado" placeholder="SP">
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="input-group">
                            <label for="numero">NÚMERO</label>
                            <input type="text" id="numero" placeholder="123">
                        </div>
                        <div class="input-group">
                            <label for="complemento">COMPLEMENTO</label>
                            <input type="text" id="complemento" placeholder="Apto, Bloco, etc.">
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="input-group">
                            <label for="bairro">BAIRRO</label>
                            <input type="text" id="bairro" placeholder="Centro">
                        </div>
                        <div class="input-group">
                            <label for="cidade">CIDADE</label>
                            <input type="text" id="cidade" placeholder="São Paulo">
                        </div>
                    </div>
                </div>

                <!-- Entidades Empregadoras -->
                <div class="secao-form">
                    <div class="header-empregadores">
                        <h2>Entidades Empregadoras</h2>
                        <button type="button" class="btn-adicionar">+ Adicionar</button>
                    </div>
                    <p class="subtext-empregadores">Máximo de 3 empregadores</p>

                    <div class="card-empregador">
                        <h3>Empregador 1</h3>
                        <div class="grid-3">
                            <div class="input-group">
                                <label for="empresa-1">EMPRESA</label>
                                <input type="text" id="empresa-1" placeholder="Empresa LTDA">
                            </div>
                            <div class="input-group">
                                <label for="cnpj-1">CNPJ</label>
                                <input type="text" id="cnpj-1" placeholder="00.000.000/0001-00">
                            </div>
                            <div class="input-group">
                                <label for="rendimento-1">RENDIMENTO</label>
                                <input type="text" id="rendimento-1" placeholder="5000.00">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botão Submit -->
                <button type="submit" class="btn-submit-cad">Criar Conta de Cliente</button>
                <p class="footer-login" style="margin-top: 16px;">Já possui uma conta? <a href="login.html">Entrar</a></p>
            </form>
        </main>

        <!-- Rodapé -->
        <footer class="rodape">
            <div class="container-rodape">
                <div class="rodape-inferior">
                    <p><small>&copy; 2026 CARent - Sistema de Locação de Veículos.</small></p>
                </div>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="site.js"></script>
    </body>
</html>
