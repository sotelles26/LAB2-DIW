<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CAR - Meu Perfil</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        </style>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="login.css">
    </head>
    <body data-requer-login>
        <div class="topo">
            <header>
                <div class="menu">
                    <nav>
                        <div class="logo"><img src="logo-escura.png" alt="CAR Logo"/></div>
                        <ul class="ul">
                            <li><a href="index.html">Início</a></li>
                            <li><a href="veiculos.html">Veículos</a></li>
                            <li><a href="pedidos.html">Pedidos</a></li>
                            <li><a href="perfil.html" class="ativa">Perfil</a></li>
                        </ul>
                        <button type="button" class="btn-tema" id="btn-tema" title="Mudar tema">
                            <img src="Son.png" class="btn-sol" alt="Mudar tema"/>
                        </button>
                        <a href="login.html" class="btn-entrar"><p>Entrar</p></a>
                        <a href="cadastro.html" class="btn-cadastrar"><p>Cadastrar</p></a>
                    </nav>
                </div>
            </header>
        </div>

        <main class="cadastro-container">
            <form id="form-perfil" class="card-cadastro">
                <div class="secao-form">
                    <h2>Meu Perfil <small id="tipo-conta" class="text-secondary" style="font-size:14px;"></small></h2>
                    <div class="box-upload-perfil" id="box-foto" style="display:none;">
                        <img id="foto-perfil" class="perfil-foto" alt="Foto">
                        <span class="upload-text">Foto do usuário</span>
                    </div>
                </div>

                <div class="secao-form">
                    <h2>Dados Principais</h2>
                    <div class="grid-2">
                        <div class="input-group"><label for="nome">NOME / RAZÃO SOCIAL</label><input type="text" id="nome" required></div>
                        <div class="input-group"><label for="email">E-MAIL</label><input type="email" id="email" required></div>
                    </div>
                    <div class="grid-2">
                        <div class="input-group"><label for="password">NOVA SENHA</label><input type="password" id="password" placeholder="Deixe em branco para manter"></div>
                        <div class="input-group"><label for="confirm-password">CONFIRMAR NOVA SENHA</label><input type="password" id="confirm-password"></div>
                    </div>
                    <div class="grid-2">
                        <div class="input-group"><label for="cpf-cnpj">CPF / CNPJ</label><input type="text" id="cpf-cnpj"></div>
                        <div class="input-group"><label for="rg">RG</label><input type="text" id="rg"></div>
                    </div>
                    <div class="input-group"><label for="profissao">PROFISSÃO</label><input type="text" id="profissao"></div>
                </div>

                <div class="secao-form">
                    <h2>Endereço</h2>
                    <div class="input-group"><label for="cep">CEP</label><input type="text" id="cep"></div>
                    <div class="grid-logradouro">
                        <div class="input-group"><label for="logradouro">LOGRADOURO</label><input type="text" id="logradouro"></div>
                        <div class="input-group"><label for="estado">ESTADO</label><input type="text" id="estado"></div>
                    </div>
                    <div class="grid-2">
                        <div class="input-group"><label for="numero">NÚMERO</label><input type="text" id="numero"></div>
                        <div class="input-group"><label for="complemento">COMPLEMENTO</label><input type="text" id="complemento"></div>
                    </div>
                    <div class="grid-2">
                        <div class="input-group"><label for="bairro">BAIRRO</label><input type="text" id="bairro"></div>
                        <div class="input-group"><label for="cidade">CIDADE</label><input type="text" id="cidade"></div>
                    </div>
                </div>

                <div class="secao-form" id="secao-empregadores">
                    <div class="header-empregadores">
                        <h2>Entidades Empregadoras</h2>
                        <button type="button" class="btn-adicionar" id="btn-add-empregador">+ Adicionar</button>
                    </div>
                    <p class="subtext-empregadores">Máximo de 3 empregadores</p>
                    <div id="lista-empregadores"></div>
                </div>

                <button type="submit" class="btn-submit-cad">Salvar alterações</button>
                <button type="button" class="btn-excluir" id="btn-excluir">Excluir minha conta</button>
            </form>
        </main>

        <footer class="rodape">
            <div class="container-rodape">
                <div class="rodape-inferior">
                    <p><small>&copy; 2026 CARent - Sistema de Locação de Veículos.</small></p>
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="site.js"></script>
        <script src="perfil.js"></script>
    </body>
</html>
